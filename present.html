<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>発表画面</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">

<style>
  :root{
    --bg:#fff3e2; --ink:#1d1a14; --muted:#8d8069; --muted2:#7d6f57;
    --accent:#ff8c42; --ok:#a0e7c4; --warn:#ffd166; --err:#ffadad; --card:#fff;
    --bd:2.5px solid var(--ink);
    --sh:3px 3px 0 var(--ink);
    --r:20px;
    --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --f-disp:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--ink);overflow:hidden;
            font-family:var(--f-body);font-weight:500}

  /* ================= 開始画面 ================= */
  #setup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
         justify-content:center;padding:26px;z-index:50;overflow:auto}
  #setup .box{width:100%;max-width:540px;display:flex;flex-direction:column;gap:20px}
  #setup h1{font-family:var(--f-disp);font-size:1.6rem;font-weight:900;margin:0;line-height:1.3}
  #setup p.lead{margin:8px 0 0;color:var(--muted2);font-size:.83rem;line-height:1.75;font-weight:500}

  .drop{border:3px dashed var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);
        padding:42px 20px;text-align:center;background:var(--card);cursor:pointer;
        transition:background .15s,transform .07s,box-shadow .07s}
  .drop:hover{background:#fffaf0}
  .drop.over{background:var(--warn)}
  .drop:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .drop .big{font-family:var(--f-disp);font-size:1.1rem;font-weight:900;margin-bottom:7px}
  .drop .sub{color:var(--muted);font-size:.78rem;line-height:1.7;font-weight:700}

  .rowline{display:flex;gap:10px;align-items:center;font-size:.78rem;
           color:var(--muted2);font-weight:700}
  .rowline input{flex:1;background:var(--card);border:var(--bd);border-radius:14px;
                 box-shadow:var(--sh);color:var(--ink);padding:11px 13px;
                 font-size:.92rem;font-family:inherit;font-weight:700;outline:none;min-width:0}

  button.primary{background:var(--accent);color:var(--ink);border:var(--bd);border-radius:var(--r);
                 box-shadow:4px 4px 0 var(--ink);padding:16px;
                 font-family:var(--f-disp);font-size:1.05rem;font-weight:900;cursor:pointer;
                 transition:transform .07s,box-shadow .07s,opacity .15s}
  button.primary:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  button.primary:disabled{opacity:.4;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}

  button.ghost{background:#bdb2ff;color:var(--ink);border:var(--bd);border-radius:14px;
               box-shadow:var(--sh);padding:10px 15px;font-size:.82rem;font-weight:900;
               font-family:var(--f-disp);cursor:pointer;white-space:nowrap;
               transition:transform .07s,box-shadow .07s}
  button.ghost:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

  .banner{border:var(--bd);border-radius:16px;box-shadow:var(--sh);
          padding:12px 15px;font-size:.79rem;line-height:1.7;display:none;
          white-space:pre-wrap;word-break:break-word;font-weight:700}
  .banner.show{display:block}
  .banner.warn{background:var(--warn)}
  .banner.err {background:var(--err)}
  .banner b{font-family:var(--f-disp);font-weight:900}

  .keys{background:#9bd4ff;border:var(--bd);border-radius:16px;box-shadow:var(--sh);
        padding:13px 16px;font-size:.75rem;line-height:2;font-weight:700}
  .keys kbd{background:var(--card);border:2px solid var(--ink);border-radius:6px;
            box-shadow:2px 2px 0 var(--ink);padding:1px 7px;margin:0 1px;
            font-family:var(--f-disp);font-size:.9em;font-weight:900;display:inline-block}

  /* ================= 発表画面 ================= */
  #stage{position:fixed;inset:0;display:none;background:var(--ink)}
  #stage.on{display:block}
  #canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          max-width:100%;max-height:100%;display:block}

  /* コメント層：スライドの上に重ねる。クリックは透過させる */
  #layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}

  /* 弾幕。太い黒フチを文字の外側にだけ描くことで、白いスライドの上でも潰れません。
     paint-order:stroke fill … 先に線、あとから塗り。これがないと線が文字を食います。 */
  .cm{position:absolute;left:100%;white-space:nowrap;
      font-family:var(--f-disp);font-weight:900;
      color:#fff;
      -webkit-text-stroke:.2em #1d1a14;
      paint-order:stroke fill;
      will-change:transform;font-size:var(--cmsize,38px);line-height:1.15;
      text-shadow:0 0 3px rgba(0,0,0,.55)}   /* フチ取り非対応ブラウザ向けの保険 */
  .cm.c1{color:#ffd166} .cm.c2{color:#a0e7c4} .cm.c3{color:#ffadad}
  .cm.c4{color:#bdb2ff} .cm.c5{color:#9bd4ff} .cm.c6{color:#fff}
  /* 絵文字は塗りが効かないので、フチではなく落ち影で浮かせます */
  .cm.stamp{font-size:calc(var(--cmsize,38px) * 1.75);
            -webkit-text-stroke:0;text-shadow:none;
            filter:drop-shadow(3px 3px 0 #1d1a14) drop-shadow(-2px -2px 0 #1d1a14)}

  /* ================= アンケートの集計パネル =================
     スライドの右上に重ねる。弾幕（z-index:5）より手前に置いて隠れないようにします。 */
  #pollbox{position:absolute;top:2.5vh;right:2vw;z-index:8;
           width:min(30vw,420px);min-width:270px;
           background:var(--bg);border:var(--bd);border-radius:var(--r);
           box-shadow:5px 5px 0 var(--ink);padding:16px 17px;
           display:none;transition:opacity .2s}
  #pollbox.on{display:block}
  #pollbox .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  #pollbox .tag{background:var(--ink);color:#fff;border-radius:999px;padding:3px 11px;
                font-family:var(--f-disp);font-weight:900;font-size:.66rem;letter-spacing:.06em}
  #pollbox .tag.closed{background:#ff6b6b;color:var(--ink);border:2px solid var(--ink)}
  #pollbox .total{margin-left:auto;font-family:var(--f-disp);font-weight:900;
                  font-size:.76rem;font-variant-numeric:tabular-nums}
  #pollbox .q{font-family:var(--f-disp);font-weight:900;font-size:1.02rem;
              line-height:1.45;margin:0 0 13px;word-break:break-word}
  #pollbox .row{margin-bottom:11px}
  #pollbox .row:last-child{margin-bottom:0}
  #pollbox .lbl{display:flex;justify-content:space-between;gap:10px;
                font-weight:700;font-size:.8rem;line-height:1.4;margin-bottom:5px}
  #pollbox .lbl .n{font-family:var(--f-disp);font-weight:900;
                   font-variant-numeric:tabular-nums;white-space:nowrap}
  #pollbox .track{height:22px;background:var(--card);border:2.5px solid var(--ink);
                  border-radius:999px;overflow:hidden}
  /* 幅の変化に時間をかけることで、票が入った瞬間が目で追えます */
  #pollbox .fill{height:100%;width:0;background:var(--accent);
                 border-right:2.5px solid var(--ink);
                 transition:width .5s cubic-bezier(.22,1,.36,1)}
  #pollbox .row:nth-child(2) .fill{background:#ffd166}
  #pollbox .row:nth-child(3) .fill{background:#a0e7c4}
  #pollbox .row:nth-child(4) .fill{background:#9bd4ff}
  #pollbox .row:nth-child(5) .fill{background:#bdb2ff}

  /* 操作バー：マウスを動かしたときだけ出る */
  #bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;
       background:var(--bg);border:var(--bd);border-radius:999px;box-shadow:4px 4px 0 var(--ink);
       padding:9px 14px;display:flex;gap:8px;align-items:center;font-size:.85rem;
       opacity:0;transition:opacity .25s;pointer-events:none}
  #bar.show{opacity:1;pointer-events:auto}
  #bar button{background:var(--card);border:2px solid var(--ink);border-radius:12px;
              color:var(--ink);font-size:.95rem;font-weight:900;font-family:var(--f-disp);
              cursor:pointer;padding:5px 11px;box-shadow:2px 2px 0 var(--ink);
              transition:transform .07s,box-shadow .07s,background .12s}
  #bar button:hover{background:var(--warn)}
  #bar button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  #bar #quit:hover{background:var(--err)}
  #bar .sep{width:2.5px;height:18px;background:var(--ink);border-radius:2px}
  #page{color:var(--ink);font-family:var(--f-disp);font-weight:900;
        font-variant-numeric:tabular-nums;min-width:70px;text-align:center;font-size:.88rem}

  /* 接続インジケータ */
  #dot{position:fixed;right:14px;top:14px;width:14px;height:14px;border-radius:50%;
       background:#ff6b6b;border:2.5px solid var(--ink);z-index:20;transition:background .3s}
  #dot.ok{background:#4ade80}

  #paused{position:fixed;inset:auto 0 0 0;background:#ff6b6b;color:var(--ink);
          border-top:3px solid var(--ink);text-align:center;padding:10px;
          font-family:var(--f-disp);font-size:.92rem;font-weight:900;z-index:30;display:none}
  #paused.on{display:block}

  body.hidecursor,body.hidecursor *{cursor:none}
</style>
</head>
<body>

<!-- ===================== 開始画面 ===================== -->
<div id="setup">
  <div class="box">
    <div>
      <h1>発表画面</h1>
      <p class="lead">
        PowerPoint を PDF で書き出したファイルを読み込みます。<br>
        PDF はこの端末の中だけで処理され、どこにも送信されません。
      </p>
    </div>

    <div class="banner" id="banner"></div>

    <div class="drop" id="drop">
      <div class="big">PDF を選ぶ</div>
      <div class="sub">クリックして選択、またはここにドラッグ＆ドロップ</div>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
    </div>

    <div class="rowline">
      <span>イベントID</span>
      <input id="eid" value="event-2026">
      <button class="ghost" id="testbtn" type="button">表示テスト</button>
    </div>

    <button class="primary" id="start" disabled>発表を開始（全画面）</button>

    <div class="keys">
      <kbd>→</kbd> <kbd>Space</kbd> 次のページ　/　<kbd>←</kbd> 前のページ<br>
      <kbd>F</kbd> 全画面の切り替え　/　<kbd>C</kbd> コメント表示の ON・OFF<br>
      <kbd>P</kbd> アンケート集計の表示・非表示<br>
      <kbd>D</kbd> テスト用のダミーコメントを流す　/　<kbd>Esc</kbd> 全画面を抜ける<br>
      市販のプレゼンリモコンは <kbd>→</kbd><kbd>←</kbd> を送るので、そのまま使えます。
    </div>
  </div>
</div>

<!-- ===================== 発表画面 ===================== -->
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="layer"></div>

  <!-- アンケートの集計。管理画面で投票が始まると現れます -->
  <div id="pollbox">
    <div class="head">
      <span class="tag" id="pollTag">投票受付中</span>
      <span class="total" id="pollTotal">0 票</span>
    </div>
    <p class="q" id="pollQ"></p>
    <div id="pollRows"></div>
  </div>
</div>

<div id="dot" title="接続状態"></div>
<div id="paused">コメントを一時停止しています</div>

<div id="bar">
  <button id="prev" title="前のページ">◀</button>
  <span id="page">– / –</span>
  <button id="next" title="次のページ">▶</button>
  <span class="sep"></span>
  <button id="togglecm" title="コメント表示">💬 ON</button>
  <button id="fs" title="全画面">⛶</button>
  <button id="quit" title="終了">✕</button>
</div>


<!-- 自己診断（通常スクリプト。モジュールが動かなくても実行される） -->
<script>
  window.__appReady = false;
  window.showBanner = function (msg, kind) {
    var el = document.getElementById("banner");
    el.innerHTML = msg;
    el.className = "banner show " + (kind || "warn");
  };
  setTimeout(function () {
    if (window.__appReady) return;
    window.showBanner(
      "<b>アプリが起動していません</b>\n" +
      (location.protocol === "file:"
        ? "ファイルを直接開いた場合、ブラウザの制限で止まることがあります。\n" +
          "このフォルダで python3 -m http.server 8000 を実行し、http://localhost:8000/present.html を開いてください。"
        : "ネットワークから部品を読み込めていない可能性があります。通信を確認して再読み込みしてください。"),
      "err");
  }, 4000);
</script>


<script type="module">
// ===========================================================================
//  設定
// ===========================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyAsIx7fO1mifb2kcC4sjzMCYZGWqx4FgpE",
  authDomain:        "live-chat-1eebe.firebaseapp.com",
  projectId:         "live-chat-1eebe",
  storageBucket:     "live-chat-1eebe.firebasestorage.app",
  messagingSenderId: "714980546124",
  appId:             "1:714980546124:web:945bdb85d3ed0fb29b06e9",
};

const DEFAULT_EVENT_ID = "event-2026";
const FLOW_SEC   = 9;    // コメントが画面を横切る秒数（小さいほど速い）
const LANES      = 8;    // コメントの行数
const MAX_ON_SCREEN = 20; // 同時に表示する最大数。超えた分は捨てる
const FONT_RATIO = 0.042; // 画面高さに対する文字サイズの比率

const FB  = "https://www.gstatic.com/firebasejs/12.17.0";
const PDF_SOURCES = [
  { lib:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs",
    wk :"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs" },
  { lib:"https://cdn.jsdelivr.net/npm/pdfjs-dist@5/build/pdf.min.mjs",
    wk :"https://cdn.jsdelivr.net/npm/pdfjs-dist@5/build/pdf.worker.min.mjs" },
];

// ===========================================================================
const $ = (id) => document.getElementById(id);
let pdfjs = null, pdfDoc = null, pageNo = 1, rendering = false, pendingPage = null;
let db = null, fs = null, unsub = [], lanesFreeAt = new Array(LANES).fill(0);
// コメント表示の状態は2つに分ける。
//   manualOn … 発表者が C キーで切り替える手元のスイッチ
//   paused   … 管理画面からかかる全体停止（こちらが優先）
let manualOn = true, paused = false;
let onScreen = 0, startedAt = Date.now(), colorIdx = 0;

// ---- アンケートの状態 ----
//   pollId     … 表示中のアンケートのID（管理画面が「結果を消す」と null に戻る）
//   pollOpen   … 受付中かどうか。締め切っても結果は出したままにする
//   pollHidden … 発表者が P キーで一時的に隠しているかどうか
let curEventId = DEFAULT_EVENT_ID;
let pollId = null, pollOpen = false, pollHidden = false;
let pollUnsubDoc = null, pollUnsubVotes = null;

// ---------- PDF.js を読み込む（1つ目が失敗したら2つ目を試す） ----------
for (const src of PDF_SOURCES) {
  try {
    pdfjs = await import(src.lib);
    pdfjs.GlobalWorkerOptions.workerSrc = src.wk;
    break;
  } catch (e) { console.warn("PDF.js の読み込みに失敗:", src.lib, e); }
}
if (!pdfjs) {
  window.showBanner("<b>PDF 表示部品を読み込めませんでした</b>\n通信環境を確認して再読み込みしてください。", "err");
}
window.__appReady = true;

// ---------- Firebase ----------
try {
  const { initializeApp } = await import(`${FB}/firebase-app.js`);
  fs = await import(`${FB}/firebase-firestore.js`);
  db = fs.getFirestore(initializeApp(firebaseConfig));
  $("dot").classList.add("ok");
} catch (e) {
  console.error(e);
  window.showBanner("<b>Firebase に接続できませんでした</b>\n" + e.message +
    "\nスライドの表示だけは可能です。", "err");
}

// ===========================================================================
//  PDF の読み込み
// ===========================================================================
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => e.target.files[0] && loadPdf(e.target.files[0]));

["dragenter","dragover"].forEach(ev =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(ev =>
  $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f && f.type === "application/pdf") loadPdf(f);
  else window.showBanner("PDF ファイルを選んでください。", "warn");
});

async function loadPdf(file) {
  if (!pdfjs) return;
  try {
    const buf = await file.arrayBuffer();          // ← 端末内で読むだけ。送信しない
    pdfDoc = await pdfjs.getDocument({ data: buf }).promise;
    pageNo = 1;
    $("drop").querySelector(".big").textContent = `✓ ${file.name}`;
    $("drop").querySelector(".sub").textContent = `全 ${pdfDoc.numPages} ページ　（別のPDFに変えるにはもう一度クリック）`;
    $("start").disabled = false;
    $("banner").className = "banner";
  } catch (e) {
    console.error(e);
    window.showBanner("<b>PDF を開けませんでした</b>\n" + e.message, "err");
  }
}

// ===========================================================================
//  発表開始
// ===========================================================================
$("start").addEventListener("click", start);
$("testbtn").addEventListener("click", () => { demoBurst(); });

async function start() {
  if (!pdfDoc) return;
  $("setup").style.display = "none";
  $("stage").classList.add("on");
  startedAt = Date.now();

  await goFullscreen();
  await renderPage(pageNo);
  subscribe($("eid").value.trim() || DEFAULT_EVENT_ID);
  keepAwake();
  showBar();
}

// ---------- ページ描画 ----------
async function renderPage(n) {
  if (!pdfDoc) return;
  if (rendering) { pendingPage = n; return; }
  rendering = true;

  const page = await pdfDoc.getPage(n);
  const cv = $("canvas"), ctx = cv.getContext("2d", { alpha:false });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  // 画面に収まる最大倍率を求める
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(window.innerWidth / base.width, window.innerHeight / base.height);
  const vp = page.getViewport({ scale: scale * dpr });

  cv.width  = Math.floor(vp.width);
  cv.height = Math.floor(vp.height);
  cv.style.width  = Math.floor(vp.width  / dpr) + "px";
  cv.style.height = Math.floor(vp.height / dpr) + "px";

  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  $("page").textContent = `${n} / ${pdfDoc.numPages}`;
  document.documentElement.style.setProperty("--cmsize",
    Math.round(window.innerHeight * FONT_RATIO) + "px");

  rendering = false;
  if (pendingPage !== null) { const p = pendingPage; pendingPage = null; renderPage(p); }
}

function go(delta) {
  if (!pdfDoc) return;
  const n = Math.min(Math.max(pageNo + delta, 1), pdfDoc.numPages);
  if (n !== pageNo) { pageNo = n; renderPage(n); }
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderPage(pageNo), 150);
});

// ===========================================================================
//  コメントの受信と描画
// ===========================================================================
function subscribe(eventId) {
  if (!db) return;
  unsub.forEach(u => u()); unsub = [];
  curEventId = eventId;

  // 直近30件を新しい順で購読する（単一フィールドの並べ替えなので索引の追加は不要）
  const q = fs.query(
    fs.collection(db, "events", eventId, "comments"),
    fs.orderBy("createdAt", "desc"),
    fs.limit(30)
  );

  unsub.push(fs.onSnapshot(q, (snap) => {
    $("dot").classList.add("ok");
    snap.docChanges().forEach((ch) => {
      if (ch.type !== "added") return;
      const d = ch.doc.data();
      if (d.hidden) return;
      // 開始前に投稿された古いコメントは流さない
      const t = d.createdAt?.toMillis?.() ?? Date.now();
      if (t < startedAt - 3000) return;
      push(d.text, d.type);
    });
  }, (err) => {
    console.error(err);
    $("dot").classList.remove("ok");
    if (String(err.code) === "permission-denied") {
      alert("コメントを読み取れません。Firestore のセキュリティルールを確認してください。");
    }
  }));

  // 一時停止フラグとアンケートの状態（どちらも管理画面から切り替わる）
  unsub.push(fs.onSnapshot(fs.doc(db, "events", eventId), (d) => {
    const v = d.exists() ? d.data() : {};
    paused = v.paused === true;
    $("paused").classList.toggle("on", paused);
    applyCommentState();
    handlePoll(v.pollId || null, v.pollOpen === true);
  }));
}

// ===========================================================================
//  アンケートの集計表示
//  管理画面が「締め切る」を押しても結果は消しません。登壇者がその場で
//  結果に触れられるようにするためで、消すのは「結果を消す」を押したときだけです。
// ===========================================================================
function handlePoll(id, open) {
  if (id !== pollId) {
    if (pollUnsubDoc)   { pollUnsubDoc();   pollUnsubDoc = null; }
    if (pollUnsubVotes) { pollUnsubVotes(); pollUnsubVotes = null; }
    pollId = id;
    $("pollRows").innerHTML = "";
    $("pollQ").textContent = "";
    $("pollTotal").textContent = "0 票";

    if (!id) { applyPollBox(); return; }

    // 設問（管理画面で文言を直したときも追従します）
    pollUnsubDoc = fs.onSnapshot(fs.doc(db, "events", curEventId, "polls", id), (s) => {
      if (!s.exists()) return;
      const v = s.data();
      $("pollQ").textContent = String(v.question || "");
      renderPollRows(Array.isArray(v.options) ? v.options.slice(0, 4) : []);
    }, (e) => console.error(e));

    // 票（1票=1ドキュメント。入るたびに数え直します）
    pollUnsubVotes = fs.onSnapshot(
      fs.collection(db, "events", curEventId, "polls", id, "votes"),
      (snap) => {
        const counts = [0, 0, 0, 0];
        snap.forEach((doc) => {
          const c = doc.data().choice;
          if (Number.isInteger(c) && c >= 0 && c <= 3) counts[c]++;
        });
        applyCounts(counts);
      }, (e) => console.error(e));
  }

  pollOpen = open;
  const tag = $("pollTag");
  tag.textContent = open ? "投票受付中" : "締め切りました";
  tag.className   = open ? "tag" : "tag closed";
  applyPollBox();
}

function applyPollBox() {
  $("pollbox").classList.toggle("on", pollId !== null && !pollHidden);
}

function togglePoll() {
  pollHidden = !pollHidden;
  applyPollBox();
}

function renderPollRows(options) {
  const wrap = $("pollRows");
  wrap.innerHTML = "";
  options.forEach((label) => {
    const row = document.createElement("div");
    row.className = "row";
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    const name = document.createElement("span");
    name.textContent = String(label);
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = "0票 0%";
    lbl.append(name, n);
    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    track.appendChild(fill);
    row.append(lbl, track);
    wrap.appendChild(row);
  });
}

function applyCounts(counts) {
  const rows  = [...$("pollRows").children];
  const total = counts.reduce((a, b) => a + b, 0);
  $("pollTotal").textContent = `${total} 票`;
  rows.forEach((row, i) => {
    const c = counts[i] || 0;
    const p = total ? Math.round(c / total * 100) : 0;
    row.querySelector(".n").textContent = `${c}票 ${p}%`;
    // 0票のときも枠が見えるよう、わずかに幅を残します
    row.querySelector(".fill").style.width = (total ? Math.max(p, 2) : 0) + "%";
  });
}

// 実際に流すかどうか。全体停止が手元のスイッチより優先される。
function commentsVisible() { return manualOn && !paused; }

function applyCommentState() {
  const on = commentsVisible();
  $("togglecm").textContent = on ? "💬 ON" : "💬 OFF";
  if (!on) { $("layer").innerHTML = ""; onScreen = 0; lanesFreeAt.fill(0); }
}

function push(text, type) {
  if (!commentsVisible() || !text) return;
  if (onScreen >= MAX_ON_SCREEN) return;      // あふれた分は捨てる（溜めない）

  const el = document.createElement("div");
  // 文字色はパステル6色を順に巡回させる。同じ色が並ばず、視線が追いやすくなります。
  el.className = "cm c" + (colorIdx++ % 6 + 1) + (type === "stamp" ? " stamp" : "");
  el.textContent = text;
  el.style.top = "-999px";
  $("layer").appendChild(el);

  // 空いている行を探す。全部埋まっていれば捨てる
  const now = performance.now();
  let lane = -1, earliest = Infinity;
  for (let i = 0; i < LANES; i++) {
    if (lanesFreeAt[i] <= now) { lane = i; break; }
    if (lanesFreeAt[i] < earliest) { earliest = lanesFreeAt[i]; }
  }
  if (lane === -1) { el.remove(); return; }

  const laneH = window.innerHeight / LANES;
  el.style.top = Math.round(lane * laneH + laneH * 0.12) + "px";

  const w = el.offsetWidth;
  const dist = window.innerWidth + w;
  const dur  = FLOW_SEC * 1000;

  // 次のコメントがこの行に入れるようになる時刻（文字が完全に出きるまで待つ）
  lanesFreeAt[lane] = now + dur * (w + window.innerWidth * 0.06) / dist;

  onScreen++;
  el.animate(
    [{ transform: "translateX(0)" }, { transform: `translateX(-${dist}px)` }],
    { duration: dur, easing: "linear" }
  ).onfinish = () => { el.remove(); onScreen--; };
}

// テスト用のダミーコメント
function demoBurst() {
  const samples = ["わかりやすい","なるほど","👏","それ気になってた","🔥","質問です",
                   "テスト表示中です","😂","いいね","❤️","参考になります","👍"];
  samples.forEach((s, i) =>
    setTimeout(() => push(s, s.length <= 2 ? "stamp" : "comment"), i * 320));
}

// ===========================================================================
//  操作
// ===========================================================================
document.addEventListener("keydown", (e) => {
  if ($("setup").style.display !== "none") return;   // 開始前は無視
  switch (e.key) {
    case "ArrowRight": case "ArrowDown": case " ": case "PageDown":
      e.preventDefault(); go(1); break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault(); go(-1); break;
    case "f": case "F": goFullscreen(); break;
    case "c": case "C": toggleComments(); break;
    case "p": case "P": togglePoll(); break;
    case "d": case "D": demoBurst(); break;
    case "Home": pageNo = 1; renderPage(1); break;
    case "End":  pageNo = pdfDoc.numPages; renderPage(pageNo); break;
  }
});

$("next").addEventListener("click", () => go(1));
$("prev").addEventListener("click", () => go(-1));
$("fs").addEventListener("click", goFullscreen);
$("togglecm").addEventListener("click", toggleComments);
// 誤って押すと PDF を読み込み直すことになるため、必ず確認する
$("quit").addEventListener("click", () => {
  if (confirm("発表を終了して最初の画面に戻ります。PDF は読み込み直しになります。よろしいですか。"))
    location.reload();
});

function toggleComments() {
  if (paused) return;          // 全体停止中は手元のスイッチで戻せない
  manualOn = !manualOn;
  applyCommentState();
}

async function goFullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) { console.warn("全画面に切り替えられません:", e); }
}

// マウスを動かしたときだけ操作バーを出し、止まったらカーソルごと隠す
let hideTimer;
function showBar() {
  $("bar").classList.add("show");
  document.body.classList.remove("hidecursor");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    $("bar").classList.remove("show");
    document.body.classList.add("hidecursor");
  }, 2500);
}
document.addEventListener("mousemove", showBar);

// 画面が消灯しないようにする
async function keepAwake() {
  try {
    if (!("wakeLock" in navigator)) return;
    let lock = await navigator.wakeLock.request("screen");
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        try { lock = await navigator.wakeLock.request("screen"); } catch {}
      }
    });
  } catch (e) { console.warn("画面の消灯防止を設定できません:", e); }
}
</script>
