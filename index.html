<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3e2">
<title>コメントを送る</title>

<!-- 極太の日本語サンセリフ。読み込めなくても端末のフォントで成立するようにしています -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">

<style>
  :root{
    /* ---- 案4（ネオブルータリズム）の配色 ---- */
    --bg:#fff3e2;          /* 生成りの背景 */
    --ink:#1d1a14;         /* 枠線と文字。真っ黒より少し温かい */
    --muted:#8d8069;       /* 補足文 */
    --muted2:#7d6f57;
    --accent:#ff8c42;      /* 送信ボタン */
    --ok:#a0e7c4;
    --warn:#ffd166;
    --err:#ffadad;
    --card:#fff;

    --bd:2.5px solid var(--ink);
    --sh:3px 3px 0 var(--ink);
    --r:20px;

    --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --f-disp:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;
       display:flex;flex-direction:column;align-items:center;
       padding:env(safe-area-inset-top) 18px calc(20px + env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px;padding:26px 0}

  /* ---------- 見出し ---------- */
  header h1{font-family:var(--f-disp);font-size:1.5rem;font-weight:900;margin:0;
            line-height:1.35;letter-spacing:.01em}
  header .lead{margin:9px 0 0;color:var(--muted2);font-size:.8rem;line-height:1.7;font-weight:500}

  /* ---------- お知らせ欄 ---------- */
  .banner{border:var(--bd);border-radius:16px;box-shadow:var(--sh);
          padding:12px 14px;font-size:.78rem;line-height:1.65;display:none;
          white-space:pre-wrap;word-break:break-word;font-weight:700}
  .banner.show{display:block}
  .banner.warn{background:var(--warn)}
  .banner.err {background:var(--err)}
  .banner b{font-family:var(--f-disp);font-weight:900}

  /* ---------- アンケート（発表中のリアルタイム投票） ---------- */
  /* 管理画面で投票が開かれている間だけ .on が付いて現れます */
  .poll{display:none;background:var(--ok);border:var(--bd);border-radius:var(--r);
        box-shadow:var(--sh);padding:16px}
  .poll.on{display:block}
  .poll .tag{display:inline-block;background:var(--ink);color:#fff;
             border-radius:999px;padding:4px 12px;font-size:.66rem;
             font-family:var(--f-disp);font-weight:900;letter-spacing:.06em}
  .poll .q{margin:11px 0 13px;font-family:var(--f-disp);font-weight:900;
           font-size:1.02rem;line-height:1.5;word-break:break-word}
  .poll .opts{display:flex;flex-direction:column;gap:9px}
  .poll .opts button{width:100%;text-align:left;background:var(--card);
                     border:var(--bd);border-radius:14px;box-shadow:var(--sh);
                     padding:13px 15px;font-family:var(--f-disp);font-weight:900;
                     font-size:.94rem;line-height:1.45;color:var(--ink);cursor:pointer;
                     word-break:break-word;
                     transition:transform .07s,box-shadow .07s,opacity .15s}
  .poll .opts button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .poll .opts button:disabled{cursor:default;transform:none;box-shadow:var(--sh);opacity:.45}
  /* 自分が選んだ選択肢だけは、締め切ったあとも濃いまま残します */
  .poll .opts button.picked{background:var(--accent);opacity:1}
  .poll .opts button.picked::after{content:" ✓"}
  .poll .done{margin:12px 0 0;font-size:.74rem;font-weight:700;color:var(--muted2)}
  .hide{display:none}

  /* ---------- スタンプ ---------- */
  .stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .stamp{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
         border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);
         font-size:2.1rem;line-height:1;padding:0;cursor:pointer;color:inherit;
         transition:transform .07s,box-shadow .07s,opacity .15s}
  .stamp:nth-child(1){background:#ffd166}
  .stamp:nth-child(2){background:#a0e7c4}
  .stamp:nth-child(3){background:#ffadad}
  .stamp:nth-child(4){background:#bdb2ff}
  .stamp:nth-child(5){background:#9bd4ff}
  .stamp:nth-child(6){background:#ffc6ff}
  /* 押した瞬間に影の分だけ沈み込む。指の下で確かに反応する感じを出します */
  .stamp:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .stamp:disabled{opacity:.4;cursor:default;transform:none;box-shadow:var(--sh)}

  /* ---------- 入力欄 ---------- */
  .field{background:var(--card);border:var(--bd);border-radius:var(--r);
         box-shadow:var(--sh);padding:14px 16px}
  textarea{width:100%;background:none;border:0;color:var(--ink);resize:none;
           font-size:1rem;line-height:1.6;font-family:inherit;font-weight:500;
           outline:none;min-height:78px;display:block}
  textarea::placeholder{color:#b3a894}
  .field .foot{display:flex;justify-content:space-between;align-items:center;
               margin-top:8px;color:var(--muted);font-size:.7rem;font-weight:700}
  .count{font-variant-numeric:tabular-nums}
  .count.over{color:#d64545}

  /* ---------- 送信 ---------- */
  button.send{width:100%;background:var(--accent);color:var(--ink);
              border:var(--bd);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);
              padding:16px;font-family:var(--f-disp);font-size:1.05rem;font-weight:900;
              cursor:pointer;transition:transform .07s,box-shadow .07s,opacity .15s}
  button.send:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  button.send:disabled{opacity:.4;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}

  /* ---------- 状態表示 ---------- */
  .status{text-align:center;color:var(--muted);font-size:.76rem;min-height:1.4em;
          line-height:1.5;font-weight:700}
  .status.ok{color:#2f8f5b} .status.warn{color:#a9761a} .status.err{color:#c93b3b}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,22px);
         background:var(--ok);color:var(--ink);border:var(--bd);border-radius:999px;
         box-shadow:4px 4px 0 var(--ink);
         font-family:var(--f-disp);font-weight:900;font-size:.9rem;
         padding:12px 24px;opacity:0;pointer-events:none;
         transition:opacity .18s,transform .18s;z-index:10}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer{color:var(--muted);font-size:.7rem;text-align:center;font-weight:700}
  footer b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="title">いま思ったこと、<br>送っちゃおう</h1>
    <p class="lead">スタンプはタップで即送信。<br>コメントは100文字まで、匿名で送れます。</p>
  </header>

  <!-- 不具合の内容を画面に出す欄。開発者ツールを開かなくても原因が分かるようにしています -->
  <div class="banner" id="banner"></div>

  <!-- アンケート。管理画面で投票が開かれている間だけ表示されます -->
  <section class="poll" id="poll">
    <span class="tag">アンケート</span>
    <p class="q" id="pollQ"></p>
    <div class="opts" id="pollOpts"></div>
    <p class="done hide" id="pollDone">回答を受け付けました。結果は発表画面に出ます。</p>
  </section>

  <div class="stamps" id="stamps"></div>

  <div class="field">
    <textarea id="text" maxlength="140" placeholder="コメントを入力…" enterkeyhint="send"></textarea>
    <div class="foot">
      <span>Enter で送信</span>
      <span class="count" id="count">0 / 100</span>
    </div>
  </div>

  <button class="send" id="send" disabled>送信する</button>

  <div class="status" id="status"></div>

  <footer><b id="sent">0</b> 件送信しました</footer>
</div>

<div class="toast" id="toast">送信しました</div>


<!-- ===================================================================
     自己診断スクリプト（通常の script。モジュールが動かなくても実行される）
     下のモジュールが起動しなかった場合に、その事実を画面へ表示します。
     =================================================================== -->
<script>
  window.__appReady = false;

  function showBanner(msg, kind) {
    var el = document.getElementById("banner");
    el.innerHTML = msg;
    el.className = "banner show " + (kind || "warn");
  }
  window.showBanner = showBanner;

  // スクリプト読み込みエラーを拾う
  window.addEventListener("error", function (e) {
    if (window.__appReady) return;
    showBanner("<b>読み込みに失敗しました</b>\n" + (e.message || e.type), "err");
  }, true);

  // 3秒経ってもアプリが起動していなければ、原因の候補を出す
  setTimeout(function () {
    if (window.__appReady) return;
    var isFile = location.protocol === "file:";
    showBanner(
      "<b>アプリが起動していません</b>\n" +
      (isFile
        ? "ファイルを直接開いた（file://）ため、ブラウザの制限で読み込みが止まっています。\n" +
          "このフォルダで次のコマンドを実行し、http://localhost:8000 を開いてください。\n" +
          "　python3 -m http.server 8000"
        : "ネットワークから Firebase の読み込みができていない可能性があります。\n" +
          "通信環境を確認して再読み込みしてください。"),
      "err"
    );
  }, 3000);
</script>


<script type="module">
// ===========================================================================
//  設定 —— ここだけ書き換えれば動作が変わります
// ===========================================================================

// Firebase の設定（Firebase コンソール → プロジェクトの設定 → マイアプリ）
const firebaseConfig = {
  apiKey:            "AIzaSyAsIx7fO1mifb2kcC4sjzMCYZGWqx4FgpE",
  authDomain:        "live-chat-1eebe.firebaseapp.com",
  projectId:         "live-chat-1eebe",
  storageBucket:     "live-chat-1eebe.firebasestorage.app",
  messagingSenderId: "714980546124",
  appId:             "1:714980546124:web:945bdb85d3ed0fb29b06e9",
};

const EVENT_TITLE      = "いま思ったこと、<br>送っちゃおう";  // 見出し（<br> で改行できます）
const DEFAULT_EVENT_ID = "event-2026";                 // イベントID（?e=xxx で上書き可）
const STAMPS      = ["👏", "😂", "❤️", "🤔", "🔥", "👍"];
const MAX_LENGTH  = 100;                               // firestore.rules と同じ値にすること
const COOLDOWN_MS = 3000;                              // 連投制限
const NG_WORDS    = ["死ね", "殺す", "きもい", "ブス", "バカ", "アホ", "http://", "https://"];

// ===========================================================================
//  以下は処理本体
// ===========================================================================
const SDK = "https://www.gstatic.com/firebasejs/12.17.0";
const $ = (id) => document.getElementById(id);

const eventId = (new URLSearchParams(location.search).get("e") || DEFAULT_EVENT_ID).trim();
let db = null, fs = null, lastSentAt = 0, sentCount = 0;
let pollId = null;   // いま開かれているアンケートのID（開いていなければ null）

// ---- 画面の組み立て（Firebase より先に済ませ、通信が失敗しても操作できるようにする）----
$("title").innerHTML = EVENT_TITLE;
$("count").textContent = `0 / ${MAX_LENGTH}`;

STAMPS.forEach((s) => {
  const b = document.createElement("button");
  b.className = "stamp";
  b.type = "button";
  b.textContent = s;
  b.setAttribute("aria-label", `スタンプ ${s} を送る`);
  b.addEventListener("click", () => submit(s, "stamp"));
  $("stamps").appendChild(b);
});

const ta = $("text");
ta.addEventListener("input", () => {
  const len = [...ta.value.trim()].length;
  $("count").textContent = `${len} / ${MAX_LENGTH}`;
  $("count").classList.toggle("over", len > MAX_LENGTH);
  $("send").disabled = len === 0 || len > MAX_LENGTH;
});
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); if (!$("send").disabled) submit(ta.value, "comment"); }
});
$("send").addEventListener("click", () => submit(ta.value, "comment"));

// ここまで来ればUIは動く。診断スクリプトの警告を止める。
window.__appReady = true;

// ---- Firebase 接続 ----
try {
  const { initializeApp } = await import(`${SDK}/firebase-app.js`);
  fs = await import(`${SDK}/firebase-firestore.js`);
  db = fs.getFirestore(initializeApp(firebaseConfig));
  setStatus("接続しました", "ok");
  setTimeout(() => setStatus("", ""), 1500);
  watchPoll();
} catch (e) {
  console.error(e);
  window.showBanner(
    "<b>Firebase に接続できませんでした</b>\n" + e.message +
    "\n設定値（apiKey など）が正しいか確認してください。", "err");
}

// ---- 送信 ----
async function submit(rawText, type) {
  const text = String(rawText).replace(/\s+/g, " ").trim();
  if (!text) return;
  if ([...text].length > MAX_LENGTH) { setStatus(`${MAX_LENGTH}文字までです`, "warn"); return; }

  if (!db) { setStatus("接続されていないため送信できません", "err"); return; }

  const wait = COOLDOWN_MS - (Date.now() - lastSentAt);
  if (wait > 0) { setStatus(`あと ${Math.ceil(wait / 1000)} 秒お待ちください`, "warn"); return; }
  lastSentAt = Date.now();
  lockButtons(true);
  buzz();

  const hidden = NG_WORDS.some((w) => text.toLowerCase().includes(w.toLowerCase()));

  try {
    await fs.addDoc(fs.collection(db, "events", eventId, "comments"), {
      text, type, hidden, createdAt: fs.serverTimestamp(),
    });

    if (type === "comment") { ta.value = ""; ta.dispatchEvent(new Event("input")); }
    sentCount++; $("sent").textContent = sentCount;
    toast(hidden ? "送信しました（確認中）" : "送信しました");
    setStatus("", "");
  } catch (e) {
    console.error(e);
    lastSentAt = 0;
    if (String(e.code) === "permission-denied") {
      setStatus("送信を拒否されました。セキュリティルールを確認してください。", "err");
    } else {
      setStatus("送信できませんでした。電波を確認してもう一度お試しください。", "err");
    }
  } finally {
    setTimeout(() => lockButtons(false), COOLDOWN_MS);
  }
}

// ===========================================================================
//  アンケート（発表中のリアルタイム投票）
//
//  読み取り量を抑えるため、参加者が購読するのは「イベント文書1件」だけです。
//  投票が開いた瞬間に設問を1回だけ取得します（人数が増えても購読は増えません）。
// ===========================================================================

// 回答済みかどうかは端末内に記録します。別の端末やシークレット窓では防げません。
function voteKey(id) { return `voted:${eventId}:${id}`; }

function watchPoll() {
  fs.onSnapshot(fs.doc(db, "events", eventId), async (d) => {
    const v  = d.exists() ? d.data() : {};
    const id = v.pollOpen === true ? (v.pollId || null) : null;
    if (id === pollId) return;          // 変化がなければ何もしない
    pollId = id;

    if (!id) { $("poll").classList.remove("on"); return; }

    try {
      const snap = await fs.getDoc(fs.doc(db, "events", eventId, "polls", id));
      if (snap.exists()) renderPoll(id, snap.data());
    } catch (e) { console.error(e); }
  }, (e) => console.error(e));
}

function renderPoll(id, data) {
  const opts = Array.isArray(data.options) ? data.options.slice(0, 4) : [];
  if (opts.length < 2) return;

  $("pollQ").textContent = String(data.question || "");
  const wrap = $("pollOpts");
  wrap.innerHTML = "";

  // 端末に記録が残っていれば、その選択肢を選んだ状態で復元します
  let voted = null;
  try {
    const raw = localStorage.getItem(voteKey(id));
    if (raw !== null) voted = Number(raw);
  } catch {}

  opts.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(label);
    if (voted !== null) {
      b.disabled = true;
      if (i === voted) b.classList.add("picked");
    }
    b.addEventListener("click", () => vote(id, i, wrap));
    wrap.appendChild(b);
  });

  $("pollDone").classList.toggle("hide", voted === null);
  $("poll").classList.add("on");
}

async function vote(id, choice, wrap) {
  if (!db) { setStatus("接続されていないため投票できません", "err"); return; }
  try { if (localStorage.getItem(voteKey(id)) !== null) return; } catch {}

  // 先に画面をロックし、二重送信を防ぎます（失敗したら下で戻します）
  try { localStorage.setItem(voteKey(id), String(choice)); } catch {}
  [...wrap.children].forEach((b, i) => {
    b.disabled = true;
    if (i === choice) b.classList.add("picked");
  });
  buzz();

  try {
    await fs.addDoc(
      fs.collection(db, "events", eventId, "polls", id, "votes"),
      { choice, createdAt: fs.serverTimestamp() }
    );
    $("pollDone").classList.remove("hide");
    toast("回答しました");
  } catch (e) {
    console.error(e);
    try { localStorage.removeItem(voteKey(id)); } catch {}
    [...wrap.children].forEach((b) => { b.disabled = false; b.classList.remove("picked"); });
    setStatus("回答を送信できませんでした。もう一度お試しください。", "err");
  }
}

// ---- UI ヘルパー ----
// 対応端末では、押した手応えを短い振動で返します（非対応端末では何も起きません）
function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch {} }

function lockButtons(disabled) {
  document.querySelectorAll(".stamp").forEach((b) => (b.disabled = disabled));
  const len = [...ta.value.trim()].length;
  $("send").disabled = disabled || len === 0 || len > MAX_LENGTH;
}
function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._id);
  toast._id = setTimeout(() => t.classList.remove("show"), 1400);
}
</script>
</body>
</html>
