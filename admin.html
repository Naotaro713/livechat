<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3e2">
<title>管理画面｜コメント</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">

<style>
  :root{
    --bg:#fff3e2; --ink:#1d1a14; --muted:#8d8069; --muted2:#7d6f57;
    --accent:#ff8c42; --ok:#a0e7c4; --warn:#ffd166; --err:#ffadad; --card:#fff;
    --bd:2.5px solid var(--ink);
    --sh:3px 3px 0 var(--ink);
    --r:20px;
    --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    --f-disp:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;
       padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:26px 0}

  h1{font-family:var(--f-disp);font-size:1.5rem;margin:0;font-weight:900;line-height:1.3}
  .sub{color:var(--muted2);font-size:.79rem;line-height:1.7;margin:8px 0 0;font-weight:500}

  .banner{border:var(--bd);border-radius:16px;box-shadow:var(--sh);
          padding:12px 15px;font-size:.78rem;line-height:1.7;display:none;
          white-space:pre-wrap;word-break:break-word;font-weight:700}
  .banner.show{display:block}
  .banner.warn{background:var(--warn)}
  .banner.err {background:var(--err)}
  .banner b{font-family:var(--f-disp);font-weight:900}

  /* ---------- カード ---------- */
  .card{background:var(--card);border:var(--bd);border-radius:var(--r);
        box-shadow:var(--sh);padding:17px}
  .card h2{font-family:var(--f-disp);font-size:.9rem;margin:0 0 13px;font-weight:900}

  label{display:block;font-size:.72rem;color:var(--muted2);margin:0 0 5px;font-weight:700}
  input[type=text],input[type=email],input[type=password]{
    width:100%;background:var(--bg);border:2px solid var(--ink);border-radius:14px;
    color:var(--ink);padding:11px 13px;font-size:.95rem;font-family:inherit;font-weight:700;
    outline:none;box-shadow:2px 2px 0 var(--ink)}
  input:focus{background:#fffaf0}
  input::placeholder{color:#b3a894;font-weight:500}
  .row{display:flex;gap:11px;flex-wrap:wrap}
  .row > *{flex:1 1 180px}

  /* JS が className を丸ごと差し替える箇所があるため、各色クラスは単体で完結させます */
  button{border:var(--bd);border-radius:14px;padding:12px 15px;font-size:.88rem;
         font-family:var(--f-disp);font-weight:900;color:var(--ink);
         box-shadow:var(--sh);cursor:pointer;background:var(--card);
         transition:transform .07s,box-shadow .07s,opacity .15s}
  button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:var(--sh)}
  .primary{background:var(--accent)}
  .ghost  {background:#bdb2ff}
  .danger {background:var(--err)}
  .stop   {background:#ff6b6b}
  .resume {background:#4ade80}

  /* ---------- タブ ---------- */
  .tabs{display:flex;gap:9px}
  .tab{flex:1;background:var(--card);border:var(--bd);border-radius:14px;
       box-shadow:var(--sh);padding:12px 6px;font-size:.85rem;
       font-family:var(--f-disp);font-weight:900;color:var(--ink);cursor:pointer}
  .tab.on{background:var(--accent)}
  .tab .n{font-variant-numeric:tabular-nums;opacity:.65}

  /* ---------- 一覧 ---------- */
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  li{background:var(--card);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);
     padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
  li.hid{background:var(--warn)}      /* 保留は黄色のブロックで一目で分かるようにする */
  .body{flex:1;min-width:0}
  .txt{font-size:.95rem;line-height:1.55;word-break:break-word;white-space:pre-wrap;font-weight:700}
  .txt.stamp{font-size:1.8rem;line-height:1.2}
  .meta{color:var(--muted2);font-size:.68rem;margin-top:7px;display:flex;gap:7px;
        flex-wrap:wrap;align-items:center;font-weight:700}
  .tag{border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:var(--bg)}
  .tag.ng{background:#ff6b6b}
  .acts{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
  .acts button{padding:8px 11px;font-size:.74rem;border-radius:11px;box-shadow:2px 2px 0 var(--ink)}
  .acts button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

  /* ---------- アンケート ---------- */
  .pq{font-family:var(--f-disp);font-weight:900;font-size:1rem;line-height:1.5;
      margin:0 0 12px;word-break:break-word}
  .pstate{display:inline-block;border:2px solid var(--ink);border-radius:999px;
          padding:2px 11px;font-family:var(--f-disp);font-weight:900;font-size:.68rem;
          margin-bottom:10px;background:var(--ok)}
  .pstate.closed{background:#ff6b6b}
  .prow{margin-bottom:10px}
  .prow:last-child{margin-bottom:0}
  .plbl{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;
        font-weight:700;margin-bottom:4px;line-height:1.4}
  .plbl .n{font-family:var(--f-disp);font-weight:900;
           font-variant-numeric:tabular-nums;white-space:nowrap}
  .ptrack{height:18px;background:var(--bg);border:2px solid var(--ink);
          border-radius:999px;overflow:hidden}
  .pfill{height:100%;width:0;background:var(--accent);transition:width .4s}
  .prow:nth-child(2) .pfill{background:#ffd166}
  .prow:nth-child(3) .pfill{background:#a0e7c4}
  .prow:nth-child(4) .pfill{background:#9bd4ff}

  .empty{color:var(--muted);font-size:.82rem;text-align:center;padding:30px 0;font-weight:700}
  .status{color:var(--muted2);font-size:.76rem;min-height:1.3em;font-weight:700}
  .status.ok{color:#2f8f5b} .status.warn{color:#a9761a} .status.err{color:#c93b3b}

  /* 管理パネルの表示制御。
     以前は #panel に style="display:flex" を直接書いていたため、インライン指定が
     .hide より強く、未ログインでもパネルが見えてしまっていました。
     指定をここへ移し、.hide には !important を付けて確実に隠します。 */
  #panel{display:flex;flex-direction:column;gap:16px}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>管理画面</h1>
    <p class="sub">保留コメントの確認・削除・全体停止と、アンケートの実施を行います。ログインが必要です。</p>
  </div>

  <div class="banner" id="banner"></div>

  <!-- ログイン -->
  <div class="card" id="loginCard">
    <h2>ログイン</h2>
    <div class="row">
      <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
      </div>
      <div>
        <label for="pw">パスワード</label>
        <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="login">ログイン</button>
    </div>
    <div class="status" id="loginStatus" style="margin-top:10px"></div>
  </div>

  <!-- 管理本体 -->
  <div id="panel" class="hide">

    <div class="card">
      <h2>イベント</h2>
      <div class="row">
        <div>
          <label for="eid">イベントID</label>
          <input type="text" id="eid" value="event-2026">
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="ghost" id="switch" style="width:100%">切り替え</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="stop" id="pause">コメントを全体停止</button>
        <button class="ghost" id="logout" style="flex:0 0 auto">ログアウト</button>
      </div>
      <div class="status" id="status" style="margin-top:10px"></div>
    </div>

    <!-- アンケート（発表中のリアルタイム投票） -->
    <div class="card">
      <h2>アンケート</h2>

      <!-- 実施中：投票が作られている間だけ出ます -->
      <div id="pollLive" class="hide">
        <span class="pstate" id="pollState">投票受付中</span>
        <p class="pq" id="pollLiveQ"></p>
        <div id="pollRows"></div>
        <p class="sub" id="pollTotal" style="margin-top:10px">0 票</p>
        <div class="row" style="margin-top:12px">
          <button class="stop" id="pollClose">投票を締め切る</button>
          <button class="ghost" id="pollClear">結果を消す</button>
        </div>
        <div class="row" style="margin-top:9px">
          <button id="pollNew">次の質問を作る</button>
        </div>
      </div>

      <!-- 作成：投票がないときだけ出ます -->
      <div id="pollForm">
        <label for="pq">質問</label>
        <input type="text" id="pq" maxlength="60" placeholder="例：この話、聞いたことがありましたか">
        <div class="row" style="margin-top:11px">
          <div><label for="po1">選択肢1</label><input type="text" id="po1" maxlength="24" placeholder="はい"></div>
          <div><label for="po2">選択肢2</label><input type="text" id="po2" maxlength="24" placeholder="いいえ"></div>
        </div>
        <div class="row" style="margin-top:11px">
          <div><label for="po3">選択肢3（空欄可）</label><input type="text" id="po3" maxlength="24"></div>
          <div><label for="po4">選択肢4（空欄可）</label><input type="text" id="po4" maxlength="24"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="primary" id="pollStart">作成して投票を開始</button>
        </div>
      </div>

      <div class="status" id="pollStatus" style="margin-top:10px"></div>
    </div>

    <div class="tabs">
      <button class="tab on" data-f="pending">保留 <span class="n" id="nPending">0</span></button>
      <button class="tab"    data-f="live">表示中 <span class="n" id="nLive">0</span></button>
      <button class="tab"    data-f="all">すべて <span class="n" id="nAll">0</span></button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty">読み込み中…</div>
  </div>

</div>


<!-- 自己診断（通常script）。モジュールが起動しなければ原因を画面に出す -->
<script>
  window.__appReady = false;
  function showBanner(msg, kind){
    var el = document.getElementById("banner");
    el.innerHTML = msg;
    el.className = "banner show " + (kind || "warn");
  }
  window.showBanner = showBanner;
  window.addEventListener("error", function(e){
    if (window.__appReady) return;
    showBanner("<b>読み込みに失敗しました</b>\n" + (e.message || e.type), "err");
  }, true);
  setTimeout(function(){
    if (window.__appReady) return;
    var isFile = location.protocol === "file:";
    showBanner(
      "<b>画面が起動していません</b>\n" +
      (isFile
        ? "ファイルを直接開いた（file://）ため、ブラウザの制限で止まっている可能性があります。\n" +
          "このフォルダで次を実行し、http://localhost:8000/admin.html を開いてください。\n" +
          "　python3 -m http.server 8000"
        : "ネットワークから Firebase の読み込みができていない可能性があります。"),
      "err");
  }, 4000);
</script>


<script type="module">
// ===========================================================================
//  設定 —— index.html / present.html と同じ Firebase プロジェクト
// ===========================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyAsIx7fO1mifb2kcC4sjzMCYZGWqx4FgpE",
  authDomain:        "live-chat-1eebe.firebaseapp.com",
  projectId:         "live-chat-1eebe",
  storageBucket:     "live-chat-1eebe.firebasestorage.app",
  messagingSenderId: "714980546124",
  appId:             "1:714980546124:web:945bdb85d3ed0fb29b06e9",
};

const DEFAULT_EVENT_ID = "event-2026";
const FETCH_LIMIT = 200;   // 直近何件を管理対象にするか
const SDK = "https://www.gstatic.com/firebasejs/12.17.0";

// ===========================================================================
const $ = (id) => document.getElementById(id);

let db = null, fs = null, auth = null, authLib = null;
let eventId = (new URLSearchParams(location.search).get("e") || DEFAULT_EVENT_ID).trim();
let filter = "pending";
let docs = [];               // 直近の全コメント
let unsubComments = null, unsubEvent = null;
let paused = false;

// ---- アンケートの状態 ----
let pollId = null, pollOpen = false;
let unsubPollDoc = null, unsubPollVotes = null;
// 実施中でも「次の質問を作る」を押せば作成欄を開ける。そのときだけ true にする。
let pollFormForced = false;

$("eid").value = eventId;

// ---- タブ切り替え（Firebase を待たずに動く）----
document.querySelectorAll(".tab").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    filter = b.dataset.f;
    render();
  });
});

window.__appReady = true;

// ---- Firebase 読み込み ----
try {
  const { initializeApp } = await import(`${SDK}/firebase-app.js`);
  fs      = await import(`${SDK}/firebase-firestore.js`);
  authLib = await import(`${SDK}/firebase-auth.js`);
  const app = initializeApp(firebaseConfig);
  db   = fs.getFirestore(app);
  auth = authLib.getAuth(app);

  authLib.onAuthStateChanged(auth, (user) => {
    if (user) {
      $("loginCard").classList.add("hide");
      $("panel").classList.remove("hide");
      subscribe();
    } else {
      $("loginCard").classList.remove("hide");
      $("panel").classList.add("hide");
      unsubscribe();
    }
  });
} catch (e) {
  console.error(e);
  window.showBanner("<b>Firebase に接続できませんでした</b>\n" + e.message, "err");
}

// ---- ログイン ----
$("login").addEventListener("click", doLogin);
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const email = $("email").value.trim();
  const pw    = $("pw").value;
  if (!email || !pw) { setLoginStatus("メールアドレスとパスワードを入力してください", "warn"); return; }
  if (!auth) { setLoginStatus("Firebase に接続されていません", "err"); return; }

  setLoginStatus("ログインしています…", "");
  $("login").disabled = true;
  try {
    await authLib.signInWithEmailAndPassword(auth, email, pw);
    setLoginStatus("", "");
    $("pw").value = "";
  } catch (e) {
    console.error(e);
    const c = String(e.code || "");
    let msg = "ログインできませんでした（" + c + "）";
    if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
      msg = "メールアドレスまたはパスワードが違います";
    else if (c.includes("operation-not-allowed"))
      msg = "メール／パスワードのログインが有効になっていません。Firebase コンソールの Authentication で有効にしてください";
    else if (c.includes("network"))
      msg = "通信に失敗しました。接続を確認してください";
    setLoginStatus(msg, "err");
  } finally {
    $("login").disabled = false;
  }
}

$("logout").addEventListener("click", () => authLib.signOut(auth));

// ---- イベント切り替え ----
$("switch").addEventListener("click", () => {
  const v = $("eid").value.trim();
  if (!v) return;
  eventId = v;
  subscribe();
  setStatus(`イベント「${eventId}」を表示しています`, "ok");
});

// ---- 購読 ----
function unsubscribe() {
  if (unsubComments) { unsubComments(); unsubComments = null; }
  if (unsubEvent)    { unsubEvent();    unsubEvent = null; }
  detachPoll();
}

function detachPoll() {
  if (unsubPollDoc)   { unsubPollDoc();   unsubPollDoc = null; }
  if (unsubPollVotes) { unsubPollVotes(); unsubPollVotes = null; }
}

function subscribe() {
  unsubscribe();
  docs = [];
  $("empty").textContent = "読み込み中…";
  render();

  // 複合索引を避けるため、単一フィールドの並べ替えのみ。絞り込みは画面側で行う。
  const q = fs.query(
    fs.collection(db, "events", eventId, "comments"),
    fs.orderBy("createdAt", "desc"),
    fs.limit(FETCH_LIMIT)
  );
  unsubComments = fs.onSnapshot(q, (snap) => {
    docs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (err) => {
    console.error(err);
    setStatus(String(err.code) === "permission-denied"
      ? "読み取りを拒否されました。セキュリティルールを確認してください。"
      : "コメントを取得できませんでした（" + err.code + "）", "err");
  });

  unsubEvent = fs.onSnapshot(fs.doc(db, "events", eventId), (d) => {
    const v = d.exists() ? d.data() : {};
    paused = v.paused === true;
    const b = $("pause");
    b.textContent = paused ? "停止を解除する" : "コメントを全体停止";
    b.className   = paused ? "resume" : "stop";
    handlePoll(v.pollId || null, v.pollOpen === true);
  }, (e) => console.error(e));
}

// ===========================================================================
//  アンケート
//    events/{eventId}          … pollId と pollOpen を持つ（どの投票を今出すか）
//    events/{eventId}/polls/{pollId}       … 設問と選択肢
//    events/{eventId}/polls/{pollId}/votes … 1票につき1ドキュメント
// ===========================================================================
function handlePoll(id, open) {
  if (id !== pollId) {
    detachPoll();
    pollId = id;
    $("pollRows").innerHTML = "";
    $("pollLiveQ").textContent = "";
    $("pollTotal").textContent = "0 票";

    if (id) {
      unsubPollDoc = fs.onSnapshot(fs.doc(db, "events", eventId, "polls", id), (s) => {
        if (!s.exists()) return;
        const v = s.data();
        $("pollLiveQ").textContent = String(v.question || "");
        renderPollRows(Array.isArray(v.options) ? v.options.slice(0, 4) : []);
      }, (e) => console.error(e));

      unsubPollVotes = fs.onSnapshot(
        fs.collection(db, "events", eventId, "polls", id, "votes"),
        (snap) => {
          const counts = [0, 0, 0, 0];
          snap.forEach((doc) => {
            const c = doc.data().choice;
            if (Number.isInteger(c) && c >= 0 && c <= 3) counts[c]++;
          });
          applyCounts(counts);
        }, (e) => console.error(e));
    }
  }

  pollOpen = open;
  if (pollId === null) pollFormForced = false;
  $("pollLive").classList.toggle("hide", pollId === null);
  $("pollForm").classList.toggle("hide", pollId !== null && !pollFormForced);
  $("pollStart").textContent = pollId !== null ? "この質問に差し替える" : "作成して投票を開始";

  const st = $("pollState");
  st.textContent = open ? "投票受付中" : "締め切りました";
  st.className   = open ? "pstate" : "pstate closed";

  const cl = $("pollClose");
  cl.textContent = open ? "投票を締め切る" : "締め切り済み";
  cl.disabled    = !open;
}

function renderPollRows(options) {
  const wrap = $("pollRows");
  wrap.innerHTML = "";
  options.forEach((label) => {
    const row = document.createElement("div");
    row.className = "prow";
    const lbl = document.createElement("div");
    lbl.className = "plbl";
    const name = document.createElement("span");
    name.textContent = String(label);
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = "0票 0%";
    lbl.append(name, n);
    const track = document.createElement("div");
    track.className = "ptrack";
    const fill = document.createElement("div");
    fill.className = "pfill";
    track.appendChild(fill);
    row.append(lbl, track);
    wrap.appendChild(row);
  });
}

function applyCounts(counts) {
  const rows  = [...$("pollRows").children];
  const total = counts.reduce((a, b) => a + b, 0);
  $("pollTotal").textContent = `${total} 票`;
  rows.forEach((row, i) => {
    const c = counts[i] || 0;
    const p = total ? Math.round(c / total * 100) : 0;
    row.querySelector(".n").textContent = `${c}票 ${p}%`;
    row.querySelector(".pfill").style.width = (total ? Math.max(p, 2) : 0) + "%";
  });
}

// ---- 次の質問を作る（実施中でも作成欄を開く）----
$("pollNew").addEventListener("click", () => {
  pollFormForced = true;
  $("pollForm").classList.remove("hide");
  $("pollStart").textContent = "この質問に差し替える";
  setPollStatus("差し替えると、いまの結果は発表画面から消えます（票の記録は残ります）。", "warn");
  $("pq").focus();
});

// ---- 作成して開始 ----
$("pollStart").addEventListener("click", async () => {
  const question = $("pq").value.trim();
  const options  = ["po1", "po2", "po3", "po4"]
    .map((k) => $(k).value.trim())
    .filter((v) => v.length > 0);

  if (!question)          { setPollStatus("質問を入力してください", "warn"); return; }
  if (options.length < 2) { setPollStatus("選択肢は2つ以上必要です", "warn"); return; }

  $("pollStart").disabled = true;
  setPollStatus("作成しています…", "");
  try {
    // 先に設問を作り、そのIDをイベント文書に書いて公開します
    const ref = await fs.addDoc(fs.collection(db, "events", eventId, "polls"), {
      question, options, createdAt: fs.serverTimestamp(),
    });
    await fs.setDoc(fs.doc(db, "events", eventId),
      { pollId: ref.id, pollOpen: true }, { merge: true });

    ["pq", "po1", "po2", "po3", "po4"].forEach((k) => ($(k).value = ""));
    pollFormForced = false;
    $("pollForm").classList.add("hide");
    setPollStatus("投票を開始しました。投稿画面に選択肢が出ています。", "ok");
  } catch (e) {
    console.error(e);
    setPollStatus("作成できませんでした（" + e.code + "）", "err");
  } finally {
    $("pollStart").disabled = false;
  }
});

// ---- 締め切る（結果は発表画面に残したままにする）----
$("pollClose").addEventListener("click", async () => {
  if (!confirm("投票を締め切ります。結果は発表画面に出したままになります。よろしいですか。")) return;
  $("pollClose").disabled = true;
  try {
    await fs.setDoc(fs.doc(db, "events", eventId), { pollOpen: false }, { merge: true });
    setPollStatus("締め切りました", "warn");
  } catch (e) {
    console.error(e);
    setPollStatus("変更できませんでした（" + e.code + "）", "err");
    $("pollClose").disabled = false;
  }
});

// ---- 結果を消す（票は残る。表示だけを下げる）----
$("pollClear").addEventListener("click", async () => {
  if (!confirm("発表画面から結果を消します。票の記録は残ります。よろしいですか。")) return;
  $("pollClear").disabled = true;
  try {
    await fs.setDoc(fs.doc(db, "events", eventId),
      { pollId: null, pollOpen: false }, { merge: true });
    setPollStatus("結果を消しました。次のアンケートを作成できます。", "ok");
  } catch (e) {
    console.error(e);
    setPollStatus("変更できませんでした（" + e.code + "）", "err");
  } finally {
    $("pollClear").disabled = false;
  }
});

// ---- 全体停止 ----
$("pause").addEventListener("click", async () => {
  const next = !paused;
  if (next && !confirm("発表画面へのコメント表示を停止します。よろしいですか。")) return;
  $("pause").disabled = true;
  try {
    await fs.setDoc(fs.doc(db, "events", eventId), { paused: next }, { merge: true });
    setStatus(next ? "コメント表示を停止しました" : "コメント表示を再開しました", next ? "warn" : "ok");
  } catch (e) {
    console.error(e);
    setStatus("変更できませんでした（" + e.code + "）", "err");
  } finally {
    $("pause").disabled = false;
  }
});

// ---- 一覧の描画 ----
function render() {
  const pending = docs.filter((d) => d.hidden === true);
  const live    = docs.filter((d) => d.hidden !== true);
  $("nPending").textContent = pending.length;
  $("nLive").textContent    = live.length;
  $("nAll").textContent     = docs.length;

  const items = filter === "pending" ? pending : filter === "live" ? live : docs;

  const ul = $("list");
  ul.innerHTML = "";
  if (!items.length) {
    $("empty").textContent =
      filter === "pending" ? "保留中のコメントはありません" : "コメントはまだありません";
    $("empty").style.display = "";
    return;
  }
  $("empty").style.display = "none";

  items.forEach((d) => {
    const li = document.createElement("li");
    if (d.hidden) li.className = "hid";

    const body = document.createElement("div");
    body.className = "body";

    const txt = document.createElement("div");
    txt.className = "txt" + (d.type === "stamp" ? " stamp" : "");
    txt.textContent = d.text ?? "";
    body.appendChild(txt);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(tag(d.type === "stamp" ? "スタンプ" : "コメント"));
    if (d.hidden) meta.appendChild(tag("保留", true));
    const t = d.createdAt?.toDate?.();
    const time = document.createElement("span");
    time.textContent = t ? t.toLocaleTimeString("ja-JP") : "送信中…";
    meta.appendChild(time);
    body.appendChild(meta);

    const acts = document.createElement("div");
    acts.className = "acts";

    const toggle = document.createElement("button");
    toggle.className = d.hidden ? "resume" : "ghost";
    toggle.textContent = d.hidden ? "表示する" : "隠す";
    toggle.addEventListener("click", () => setHidden(d.id, !d.hidden));
    acts.appendChild(toggle);

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "削除";
    del.addEventListener("click", () => remove(d.id, d.text));
    acts.appendChild(del);

    li.appendChild(body);
    li.appendChild(acts);
    ul.appendChild(li);
  });
}

function tag(label, ng) {
  const s = document.createElement("span");
  s.className = "tag" + (ng ? " ng" : "");
  s.textContent = label;
  return s;
}

// ---- 個別操作 ----
async function setHidden(id, hidden) {
  try {
    await fs.updateDoc(fs.doc(db, "events", eventId, "comments", id), { hidden });
    setStatus(hidden ? "保留にしました" : "表示に戻しました（発表画面には今後の分から流れます）", "ok");
  } catch (e) {
    console.error(e);
    setStatus("変更できませんでした（" + e.code + "）", "err");
  }
}

async function remove(id, text) {
  if (!confirm(`削除します。よろしいですか。\n\n${text}`)) return;
  try {
    await fs.deleteDoc(fs.doc(db, "events", eventId, "comments", id));
    setStatus("削除しました", "ok");
  } catch (e) {
    console.error(e);
    setStatus("削除できませんでした（" + e.code + "）", "err");
  }
}

// ---- ヘルパー ----
function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
function setPollStatus(msg, kind) {
  const el = $("pollStatus");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
function setLoginStatus(msg, kind) {
  const el = $("loginStatus");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}
</script>
